name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify NEXT_PUBLIC_PARTYKIT_HOST is set
        run: |
          if [ -z "${{ vars.NEXT_PUBLIC_PARTYKIT_HOST }}" ]; then
            echo "::error::NEXT_PUBLIC_PARTYKIT_HOST repo variable is not set — the deployed site would be unable to connect to the game server."
            exit 1
          fi
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /croco2
          NEXT_PUBLIC_PARTYKIT_HOST: ${{ vars.NEXT_PUBLIC_PARTYKIT_HOST }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
